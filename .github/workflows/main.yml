name: Deploy to cPanel

on:
  push:
    branches:
      - mehedi

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build and export project
        run: |
          echo "Starting build process..."
          npm run build
          echo "Build completed. Checking output..."

      - name: Verify build output
        run: |
          echo "Checking if out directory exists..."
          ls -la
          if [ -d "out" ]; then
            echo "✅ Build successful - out directory found"
            echo "Contents of out directory:"
            ls -la out/
            echo "Total files in out directory:"
            find out -type f | wc -l
            echo "Sample files:"
            find out -type f | head -10
          else
            echo "❌ Build failed - out directory not found"
            echo "Current directory contents:"
            ls -la
            echo "Checking for other build outputs..."
            if [ -d ".next" ]; then
              echo "Found .next directory - this suggests build worked but export failed"
              ls -la .next/
            fi
            exit 1
          fi

      - name: Upload files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /mehedi213.me/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
